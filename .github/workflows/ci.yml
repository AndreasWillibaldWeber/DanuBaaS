name: DanuBaaS CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.8'
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go test ./internal/httpapi -run='^$' -fuzz=FuzzPOSTNeverPanics -fuzztime=10s
      - run: go build ./cmd/sensor-api
      - run: make test-deploy
      - run: make test-security
  database:
    runs-on: ubuntu-latest
    services:
      database:
        image: timescale/timescaledb:2.27.1-pg17@sha256:6e4b469dee0395a8a6d8c818384b0226a749997a29a312f314413f98e4161f82
        env:
          POSTGRES_DB: sensor_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sensor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.26.8'
      - run: go test -race -count=1 -tags=integration ./internal/postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-ci-password@localhost:5432/sensor_test?sslmode=disable
  end-to-end:
    name: Compose E2E (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [api, mqtt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Select write route in a fresh development environment
        env:
          E2E_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path('deploy/.env.example').read_text()
          Path('deploy/.env').write_text(template.replace('INGESTION_BACKEND=api', 'INGESTION_BACKEND=' + os.environ['E2E_BACKEND']))
          PY
      - run: make dev
      - name: Verify writes and reads with curl
        env:
          E2E_BACKEND: ${{ matrix.backend }}
        run: make test-e2e E2E_ARGS="--node-red-backend $E2E_BACKEND"
      - name: Show service status on failure
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml ps --all
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml down --volumes --remove-orphans
