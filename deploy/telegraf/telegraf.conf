[agent]
  flush_interval = "1s"
  metric_batch_size = 16
  metric_buffer_limit = 128
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["normalized/v1/batch"]
  client_id = "telegraf-timescale-v1"
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 1
  persistent_session = true
  max_undelivered_messages = 64
  topic_tag = ""
  name_override = "mqtt_ingest"
  # Carry JSON as an opaque string: retain metadata and each complete batch.
  data_format = "value"
  data_type = "string"

[[outputs.postgresql]]
  connection = "host=timescaledb user=telegraf_writer dbname=sensors sslmode=disable"
  schema = "sensor"
  timestamp_column_type = "timestamp with time zone"
  create_templates = []
  add_column_templates = []
