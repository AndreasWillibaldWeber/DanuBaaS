    <circle cx="1079" cy="178" r="19" stroke="#85d8d0" stroke-width="3"/>
    <path d="M879 181l5-8 5 9 5-7" stroke="#4dd0cd" stroke-width="2.5"/>
    <path d="M973 172v13m7-17v21m7-15v11" stroke="#4dd0cd" stroke-width="2.5"/>
    <path d="M1069 184l8-8 7 4 8-11" stroke="#4dd0cd" stroke-width="2.5"/>
