    <path d="M25 96c15 0 15-36 30-36s15 36 30 36 15-36 30-36" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <circle cx="115" cy="60" r="9" fill="#e7b765"/>
    <path d="M33 116h81" fill="none" stroke="#dceaf0" stroke-linecap="round" stroke-width="5" opacity=".85"/>
  </g>
  <text x="258" y="145" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">DanuBaaS</text>
  <text x="260" y="191" fill="#c4d9e3" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">Reliable sensor observations, from ingest to insight.</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -50)">
    <path d="M811 178h58m38 0h58m38 0h58" stroke="#83c4c4" stroke-width="3" opacity=".55"/>
    <circle cx="887" cy="178" r="19" stroke="#85d8d0" stroke-width="3"/>
