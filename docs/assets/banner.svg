<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">DanuBaaS</title>
  <desc id="desc">Sensor data flows through an authenticated backend into a database and monitoring dashboard.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d2f49"/>
      <stop offset="1" stop-color="#174765"/>
    </linearGradient>
    <linearGradient id="wave" x2="1" y2="0">
      <stop stop-color="#4dd0cd"/>
      <stop offset="1" stop-color="#8fe3dc"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-width="1" opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="994" cy="147" r="154" fill="#4dd0cd" opacity=".055"/>
  <circle cx="1080" cy="35" r="96" fill="#ffffff" opacity=".035"/>
  <g transform="translate(69 77)">
