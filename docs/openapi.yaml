openapi: 3.1.0
info:
  title: DanuBaaS Sensor and Alert API
  version: 0.2.0
  description: |
    Immutable observations and versioned water-level alert rules. All operations require X-API-Key.
    Alert writes require the separate alert administrator key; sensor keys permit alert reads.
    POST commits an object or an atomic batch. Identical retries retain IDs and
    receive the original records. Lists use commit-ordered cursor pagination.
servers:
  - url: https://api.localhost
security:
  - APIKey: []
paths:
  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      summary: List rules ordered by ID
      description: Use the final ID as after to retrieve the next page, stopping at an empty array.
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/AlertLimit'}
      responses:
        '200':
          description: Rule page
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AlertRule'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createAlertRule
      summary: Create one rule per sensor; administrative key required
      security: [{AlertAdminKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRule'}
      responses:
        '201':
          description: Created, including server-generated version and updated_at
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Alert administrator key required}
        '409': {description: Rule ID or sensor already configured}
        '422': {description: Invalid parameters; creation requires version zero}
  /api/v1/alert-rules/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAlertRule
      summary: Read a rule
      responses:
        '200':
          description: Current rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '404': {description: Rule not found}
    put:
      operationId: replaceAlertRule
      summary: Replace parameters using the current version as an optimistic lock
      description: ID and sensor_id are immutable. Existing alert conditions are retired and fresh observations are required. Set enabled=false to disable; historical records are preserved.
      security: [{AlertAdminKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertRule'}
      responses:
        '200':
          description: Updated rule with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertRule'}
        '403': {description: Alert administrator key required}
        '409': {description: Version conflict; reload before editing}
        '422': {description: Invalid parameters or attempted identity change}
  /api/v1/alert-rules/{id}/versions:
    get:
      operationId: listAlertRuleVersions
      summary: Read immutable configuration history
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/AlertAfter'}
        - {$ref: '#/components/parameters/AlertLimit'}
      responses:
        '200':
          description: Version history ordered by version; use final version as next after
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List alert occurrences
      parameters:
        - {$ref: '#/components/parameters/AlertAfter'}
        - {$ref: '#/components/parameters/AlertLimit'}
        - {name: active, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Ordered by ID; use final ID as after for the next page
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Alert'}}
  /api/v1/alerts/{id}:
    get:
      operationId: getAlert
      summary: Read an alert occurrence
      parameters:
        - {$ref: '#/components/parameters/AlertID'}
      responses:
        '200':
          description: Alert occurrence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '404': {description: Alert not found}
  /api/v1/alerts/{id}/events:
    get:
      operationId: listAlertEvents
      summary: Read alert evidence and transition history
      parameters:
        - {$ref: '#/components/parameters/AlertID'}
        - {$ref: '#/components/parameters/AlertAfter'}
        - {$ref: '#/components/parameters/AlertLimit'}
      responses:
        '200':
          description: Events ordered by ID; use final ID as next after
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /api/v1/alerts/{id}/acknowledgments:
    post:
      operationId: acknowledgeAlert
      summary: Idempotently acknowledge an alert without resolving its condition
      description: Actor is the authenticated shared alert-admin principal, not an individually identified person.
      security: [{AlertAdminKey: []}]
      parameters:
        - {$ref: '#/components/parameters/AlertID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 2000, description: Maximum 2000 UTF-8 bytes}
      responses:
        '200': {description: Acknowledged; first acknowledgment is preserved on retry}
        '403': {description: Alert administrator key required}
        '404': {description: Alert not found}
  /api/v1/alerting-status:
    get:
      operationId: getAlertingStatus
      summary: Check successful evaluator execution and notification backlog
      responses:
        '200': {description: Last evaluation succeeded within three configured intervals}
        '503': {description: No recent successful evaluation}
  /api/v1/values:
    post:
      operationId: postValues
      summary: Commit one observation or an atomic batch
      description: |
        Body limit 1 MiB, normalized observation limit 16 KiB; no duplicate JSON keys, trailing documents, or query
        parameters. Every ID must be unique within a batch. Reusing an ID with
        different content rolls back the entire batch. Supply application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Value'
                - type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: '#/components/schemas/Value'}
      responses:
        '201':
          description: At least one new observation committed; response shape matches request
          headers:
            Location:
              description: Single-object requests only; resource URL with id query
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '200':
          description: Every observation was an identical replay; original records returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: ID conflict; no values from this batch were written
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Body exceeds 1 MiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: Unsupported media type or Content-Encoding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid observation or batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: getValues
      summary: Read one observation or a page of all observations
      description: |
        id cannot be combined with limit or after. Unknown, empty, repeated, or
        malformed query parameters are rejected. Follow Link until absent to
        traverse all values. Pages reflect a live dataset, not a frozen snapshot.
      parameters:
        - name: id
          in: query
          schema: {$ref: '#/components/schemas/ID'}
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: One object with id, otherwise an array (possibly empty)
          headers:
            X-Next-Cursor:
              description: Present only when more records were available
              schema: {type: string, pattern: '^[0-9]+$'}
            Link:
              description: Relative next-page URL with rel="next"
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: The requested observation does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  parameters:
    AlertID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AlertAfter:
      name: after
      in: query
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    AlertLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
  securitySchemes:
    AlertAdminKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Separate alert_admin_key secret; never distribute to sensor publishers
    APIKey: {type: apiKey, in: header, name: X-API-Key}
  schemas:
    AlertRule:
      type: object
      additionalProperties: false
      required: [id, sensor_id, enabled, level_warning, level_critical, rise_warning, rise_critical, rise_period_seconds, rise_window_seconds, rise_min_seconds, level_hysteresis, rise_hysteresis, hold_seconds, stale_seconds, version]
      description: Canonical sensor_type water-level and unit m only. All thresholds must be finite; warning is below critical. Hysteresis is smaller than the corresponding threshold gap. Durations are seconds. Writes reject duplicate keys, unknown fields, trailing JSON and bodies above 16 KiB.
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        sensor_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        enabled: {type: boolean}
        level_warning: {type: number, description: Warning water level in metres}
        level_critical: {type: number, description: Critical water level in metres}
        rise_warning: {type: number, exclusiveMinimum: 0, description: Warning metres of rise per rise_period_seconds}
        rise_critical: {type: number, exclusiveMinimum: 0, description: Critical metres of rise per rise_period_seconds}
        rise_period_seconds: {type: integer, minimum: 1, maximum: 86400}
        rise_window_seconds: {type: integer, minimum: 2, maximum: 86400}
        rise_min_seconds: {type: integer, minimum: 1, description: Must be below rise_window_seconds}
        level_hysteresis: {type: number, minimum: 0}
        rise_hysteresis: {type: number, minimum: 0}
        hold_seconds: {type: integer, minimum: 0, description: Must not exceed stale_seconds}
        stale_seconds: {type: integer, maximum: 604800, description: Must be at least rise_min_seconds}
        version: {type: integer, minimum: 0, description: Zero for create; current version for replacement}
        updated_at: {type: string, format: date-time, readOnly: true}
    Alert:
      type: object
      properties:
        id: {type: integer, format: int64}
        rule_id: {type: string}
        rule_version: {type: integer}
        kind: {type: string, enum: [level, rise, stale]}
        severity: {type: string, enum: [warning, critical]}
        opened_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        acknowledged_by: {type: [string, 'null']}
        acknowledgment_note: {type: [string, 'null']}
    ID:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Lowercase client-generated UUID retained on retry
    Coordinates:
      type: [array, 'null']
      description: Optional WGS84 [longitude, latitude] in decimal degrees. Missing and null are equivalent and omitted in responses. Zero coordinates are valid.
      minItems: 2
      maxItems: 2
      prefixItems:
        - {type: number, minimum: -180, maximum: 180}
        - {type: number, minimum: -90, maximum: 90}
      items: false
      examples: [[16.3738, 48.2082], [0, 0], null]
    LocationID:
      type: [integer, 'null']
      minimum: 0
      maximum: 9007199254740991
      description: Optional external location identifier; send an integer JSON literal. No registry lookup is performed. Missing and null are equivalent and omitted in responses. Zero is valid.
      examples: [7, 0, null]
    Value:
      type: object
      additionalProperties: false
      required: [id, sensor_id, sensor_type, timestamp, value, unit]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        sensor_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        gateway_id: {type: [string, 'null'], pattern: '^$|^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        sensor_type: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
        timestamp:
          type: string
          format: date-time
          description: RFC3339 with timezone; years 1970–9999; at most microsecond precision
        value: {type: number, format: double, description: Finite numeric observation; zero is valid}
        unit: {type: string, minLength: 1, maxLength: 32, description: Maximum 32 UTF-8 bytes; no surrounding whitespace}
        lon_lat: {$ref: '#/components/schemas/Coordinates'}
        location_id: {$ref: '#/components/schemas/LocationID'}
        metadata:
          type: [object, 'null']
          description: Source-specific JSON fields; key length 1–128 UTF-8 bytes
          propertyNames: {minLength: 1, maxLength: 128}
          additionalProperties: true
    Record:
      type: object
      required: [id, sensor_id, sensor_type, timestamp, value, unit, sequence, received_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        sensor_id: {type: string}
        gateway_id: {type: string}
        sensor_type: {type: string}
        timestamp: {type: string, format: date-time}
        value: {type: number}
        unit: {type: string}
        lon_lat: {$ref: '#/components/schemas/Coordinates'}
        location_id: {$ref: '#/components/schemas/LocationID'}
        metadata: {type: object, additionalProperties: true}
        sequence: {type: integer, format: int64}
        received_at: {type: string, format: date-time}
      additionalProperties: false
    WriteResult:
      oneOf:
        - {$ref: '#/components/schemas/Record'}
        - type: array
          items: {$ref: '#/components/schemas/Record'}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    BadRequest:
      description: Malformed JSON, invalid field types, or invalid query
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: A single valid X-API-Key header is required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Storage operation failed; retry with the same IDs
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
